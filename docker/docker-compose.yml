version: '3.8'
services:
  frontend:
    build: ../frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://backend:8000

  backend:
    build: ../backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development

  chromadb:
    image: chromadb/chroma
    ports:
      - "8001:8000"
